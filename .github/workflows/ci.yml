name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    container: frotty/wurstscript
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Static UI guardrail
        run: python3 tools/table-ui-static-check.py --base "${{ github.event.pull_request.base.sha || github.event.before }}"

      - name: Diff integrity
        run: git diff --check "${{ github.event.pull_request.base.sha || github.event.before }}...HEAD"

      - name: Install WurstScript compiler
        run: grill install wurstscript

      - name: Install dependencies
        run: grill install

      - name: Run tests
        run: grill test
